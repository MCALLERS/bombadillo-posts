<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Finance Dashboard — Access Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .error.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blueprint Finance</h1>
        <p>Contract management dashboard — access code required</p>
        <input 
            type="password" 
            id="password" 
            placeholder="Enter access code" 
            autocomplete="off"
            autofocus
        >
        <button onclick="checkPassword()">Access Dashboard</button>
        <div id="error" class="error">Incorrect access code. Please try again.</div>
    </div>

    <script>
        const correctPassword = 'blueprint2026';
        
        function checkPassword() {
            const input = document.getElementById('password');
            const error = document.getElementById('error');
            
            if (input.value === correctPassword) {
                window.location.href = 'main.html';
            } else {
                error.classList.add('show');
                input.value = '';
                input.focus();
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
